server:
  port: 18080

# GraphQL 元数据：tenant 固定为 0；URL 由前端选择环境后通过 X-Env 动态解析
metadata-source:
  tenant-id: "0"
  page-size: 10000000
  # 内网 GraphQL 多为企业/自签证书，Java 默认不信任会报 PKIX path building failed
  trust-all-ssl: true

# 配置体检中心「本地检查」：直连本机租户库（开发态，未部署环境时使用）
metadata-local:
  host: localhost
  port: 5432
  database: testapp
  username: postgres
  password: "123"

writeback-sql:
  tenant-id: 3XNLNA60G34006P

expression-engine:
  local-writeback-sql: false

decision-table:
  scan-path: /Users/pengfyu/workspace/feature/dev

spring:
  mvc:
    async:
      request-timeout: -1
  jackson:
    serialization:
      INDENT_OUTPUT: true

logging:
  level:
    root: INFO
    com.deepmodel.relation: DEBUG

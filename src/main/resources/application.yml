server:
  port: 18080

# GraphQL 元数据：tenant 固定为 0；URL 由前端选择环境后通过 X-Env 动态解析
metadata-source:
  tenant-id: "0"
  page-size: 10000000
  # 内网 GraphQL 多为企业/自签证书，Java 默认不信任会报 PKIX path building failed
  trust-all-ssl: true

writeback-sql:
  tenant-id: 3XNLNA60G34006P

expression-engine:
  local-writeback-sql: false

spring:
  mvc:
    async:
      request-timeout: -1
  jackson:
    serialization:
      INDENT_OUTPUT: true

logging:
  level:
    root: INFO
    com.deepmodel.relation: DEBUG

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepModel - FuncUnit 编排模拟器</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus/dist/index.css" />
    <style>
        :root { --el-color-primary: #6366f1; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: #0f172a; height: 100vh; overflow: hidden; color: #e2e8f0; }
        #app { height: 100%; display: flex; flex-direction: column; }

        .header {
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
            height: 60px; border-bottom: 1px solid rgba(99,102,241,0.2);
            display: flex; align-items: center; padding: 0 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3); flex-shrink: 0;
        }
        .logo { font-size: 18px; font-weight: 700; color: #e2e8f0; display: flex; align-items: center; gap: 10px; }
        .logo-mark {
            width: 28px; height: 28px; border-radius: 8px;
            background: radial-gradient(circle at 0 0,#38bdf8,#6366f1 45%,#a855f7 100%);
            box-shadow: 0 0 12px rgba(99,102,241,0.5);
        }

        .toolbar { display: flex; align-items: center; gap: 16px; margin-left: 32px; flex: 1; }
        .toolbar .el-select { width: 220px; }

        .main { flex: 1; display: flex; overflow: hidden; }

        /* 左侧面板 - 对象+操作选择 */
        .left-panel {
            width: 280px; background: #1e293b; border-right: 1px solid #334155;
            display: flex; flex-direction: column; flex-shrink: 0;
        }
        .filter-section { padding: 16px; border-bottom: 1px solid #334155; }
        .filter-label { font-size: 11px; color: #64748b; font-weight: 600; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }

        .op-list { flex: 1; overflow-y: auto; }
        .op-item {
            padding: 10px 16px; cursor: pointer; border-left: 3px solid transparent;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 13px; color: #94a3b8; transition: all 0.15s;
        }
        .op-item:hover { background: rgba(99,102,241,0.08); color: #c7d2fe; }
        .op-item.active { background: rgba(99,102,241,0.15); border-left-color: #6366f1; color: #a5b4fc; font-weight: 600; }
        .method-badge {
            font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 99px;
            min-width: 24px; text-align: center;
        }

        /* 右侧 */
        .right-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

        .sim-header {
            padding: 20px 24px 16px; background: #1e293b; border-bottom: 1px solid #334155;
            flex-shrink: 0;
        }
        .sim-title { font-size: 22px; font-weight: 700; color: #f1f5f9; }
        .sim-subtitle { font-size: 13px; color: #64748b; margin-top: 4px; }
        .layer-tags { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .layer-tag {
            font-size: 11px; padding: 3px 10px; border-radius: 99px;
            border: 1px solid #334155; color: #94a3b8; background: #0f172a;
            cursor: pointer; transition: all 0.15s; user-select: none;
        }
        .layer-tag:hover { opacity: 0.85; transform: scale(1.03); }
        .layer-tag.active { box-shadow: 0 0 0 2px rgba(255,255,255,0.25), 0 0 12px rgba(99,102,241,0.3); transform: scale(1.05); }
        .layer-tag.base { border-color: #3b82f6; color: #93c5fd; }
        .layer-tag.base.active { background: rgba(59,130,246,0.2); }
        .layer-tag.mixin { border-color: #10b981; color: #6ee7b7; }
        .layer-tag.mixin.active { background: rgba(16,185,129,0.2); }
        .layer-tag.app { border-color: #f59e0b; color: #fcd34d; }
        .layer-tag.app.active { background: rgba(245,158,11,0.2); }

        .excl-tags { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
        .excl-tag {
            font-size: 10px; padding: 2px 8px; border-radius: 99px;
            background: rgba(239,68,68,0.1); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3);
        }

        .sim-body { flex: 1; overflow-y: auto; padding: 20px 24px; }

        /* 步骤卡片 */
        .step-card {
            background: #1e293b; border-radius: 12px; border: 1px solid #334155;
            margin-bottom: 16px; overflow: hidden;
        }
        .step-header {
            padding: 12px 20px; display: flex; align-items: center; gap: 12px;
            cursor: pointer; user-select: none;
        }
        .step-header:hover { background: rgba(99,102,241,0.05); }
        .step-num {
            width: 28px; height: 28px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center;
            font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0;
        }
        .step-name { font-size: 14px; font-weight: 600; color: #f1f5f9; }
        .step-name-zh { font-size: 12px; color: #475569; margin-left: 8px; }
        .step-badge {
            margin-left: auto; font-size: 11px; font-weight: 600;
            padding: 2px 10px; border-radius: 99px;
        }
        .step-body { border-top: 1px solid #1e293b; }

        .fu-item {
            padding: 10px 20px 10px 60px; display: flex; align-items: center;
            font-size: 13px; border-bottom: 1px solid rgba(51,65,85,0.3); gap: 8px;
        }
        .fu-item:last-child { border-bottom: none; }
        .fu-item:hover { background: rgba(99,102,241,0.05); }
        .fu-name { font-weight: 500; color: #c7d2fe; }
        .fu-spec { font-size: 11px; color: #475569; font-family: 'JetBrains Mono', monospace; }
        .fu-source {
            font-size: 10px; margin-left: auto; white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; max-width: 200px; padding: 1px 8px;
            border-radius: 4px;
        }
        .fu-source.from-base { color: #93c5fd; background: rgba(59,130,246,0.1); }
        .fu-source.from-mixin { color: #6ee7b7; background: rgba(16,185,129,0.1); }
        .fu-source.from-app { color: #fcd34d; background: rgba(245,158,11,0.1); }
        .fu-source.from-db { color: #f0abfc; background: rgba(217,70,239,0.15); border: 1px solid rgba(217,70,239,0.3); }
        .layer-tag.db { border-color: #d946ef; color: #f0abfc; }
        .layer-tag.db.active { background: rgba(217,70,239,0.2); }

        .fu-entity-cond {
            font-size: 10px; padding: 1px 6px; border-radius: 4px;
            background: rgba(139,92,246,0.1); color: #c4b5fd; border: 1px solid rgba(139,92,246,0.2);
        }
        .fu-root-badge {
            font-size: 10px; padding: 1px 6px; border-radius: 4px;
        }
        .fu-root-true { background: rgba(16,185,129,0.1); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.2); }
        .fu-root-false { background: rgba(245,158,11,0.1); color: #fcd34d; border: 1px solid rgba(245,158,11,0.2); }

        .empty-state { text-align: center; padding: 80px 40px; color: #475569; }
        .empty-state h3 { font-size: 16px; color: #64748b; margin-bottom: 8px; }

        .step-0 { background: #6366f1; } .step-0-bg { background: rgba(99,102,241,0.15); color: #a5b4fc; }
        .step-1 { background: #f59e0b; } .step-1-bg { background: rgba(245,158,11,0.15); color: #fcd34d; }
        .step-2 { background: #ef4444; } .step-2-bg { background: rgba(239,68,68,0.15); color: #fca5a5; }
        .step-3 { background: #3b82f6; } .step-3-bg { background: rgba(59,130,246,0.15); color: #93c5fd; }
        .step-4 { background: #10b981; } .step-4-bg { background: rgba(16,185,129,0.15); color: #6ee7b7; }
        .step-5 { background: #8b5cf6; } .step-5-bg { background: rgba(139,92,246,0.15); color: #c4b5fd; }
        .step-6 { background: #ec4899; } .step-6-bg { background: rgba(236,72,153,0.15); color: #f9a8d4; }

        /* 搜索高亮 */
        .sim-search { margin-top: 12px; }
        .total-bar { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
        .total-num { font-size: 28px; font-weight: 800; background: linear-gradient(135deg,#6366f1,#a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* 滚动条 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.3.4/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/element-plus@2.4.4/dist/index.full.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@element-plus/icons-vue@2.3.1/dist/index.iife.min.js"></script>
</head>
<body>
<div id="app">
    <header class="header">
        <div class="logo"><div class="logo-mark"></div><span>FuncUnit 编排模拟器</span></div>
        <div class="toolbar">
            <span style="color:#475569;font-size:13px">共 {{ folders.length }} 个 Service</span>
        </div>
        <a href="/" style="color:#64748b;font-size:12px;text-decoration:none;">← 首页</a>
    </header>

    <div class="main">
        <!-- 左侧：对象选择 + 操作列表 -->
        <div class="left-panel">
            <div class="filter-section">
                <div class="filter-label">对象名称</div>
                <el-select v-model="selectedFolder" filterable placeholder="搜索对象..." size="default"
                           @change="onFolderChange" style="width:100%">
                    <el-option v-for="f in folders" :key="f" :label="f" :value="f" />
                </el-select>
            </div>
            <div class="filter-section" v-if="methods.length > 0">
                <div class="filter-label">操作方法 ({{ methods.length }})</div>
            </div>
            <div class="op-list" v-if="methods.length > 0">
                <div v-for="m in methods" :key="m"
                     class="op-item" :class="{ active: selectedMethod === m }"
                     @click="selectMethod(m)">
                    <span>{{ m }}</span>
                </div>
            </div>
        </div>

        <!-- 右侧：模拟结果 -->
        <div class="right-panel">
            <template v-if="simResult">
                <div class="sim-header">
                    <div class="sim-title">{{ simResult.objectName }}.{{ displayMethod }}</div>
                    <div class="total-bar">
                        <span class="total-num">{{ simResult.totalFuncUnits }}</span>
                        <span style="color:#64748b;font-size:13px">个 FuncUnit · 7 步生命周期</span>
                    </div>
                    <div class="layer-tags">
                        <span v-for="l in simResult.layers" :key="l.name"
                              class="layer-tag" :class="[getLayerClass(l.name), { active: sourceFilter === l.name }]"
                              @click="toggleSourceFilter(l.name)">
                            {{ l.name }}
                        </span>
                        <span v-if="dbFuncUnitsCount > 0" class="layer-tag db"
                              :class="{ active: sourceFilter === 'DB' }"
                              @click="toggleSourceFilter('DB')">
                            DB:FuncUnitCustomizer ({{ dbFuncUnitsCount }})
                        </span>
                        <span v-if="sourceFilter" style="font-size:10px;color:#64748b;cursor:pointer;align-self:center;margin-left:4px"
                              @click="sourceFilter = null">✕ 清除过滤</span>
                    </div>
                    <div class="excl-tags" v-if="simResult.exclusions && simResult.exclusions.length">
                        <span style="font-size:10px;color:#64748b;margin-right:4px">排除 ({{ simResult.exclusions.length }}):</span>
                        <span v-for="e in simResult.exclusions" :key="e.name + e.step + e.source" class="excl-tag"
                              :title="'步骤: ' + e.step + ' | 来源: ' + e.source + ' | CSV: ' + e.csvFile">
                            {{ e.name }}
                            <span style="text-decoration:none;opacity:0.6;margin-left:3px;font-size:9px">{{ e.step }} · {{ e.source }}</span>
                        </span>
                    </div>
                    <div class="sim-search" style="margin-top:12px">
                        <el-input v-model="fuFilter" placeholder="过滤 FuncUnit..." clearable size="small" style="width:300px" />
                    </div>
                </div>
                <div class="sim-body">
                    <div v-for="(step, idx) in STEPS" :key="step.key" class="step-card">
                        <div class="step-header" @click="toggleStep(step.key)">
                            <div class="step-num" :class="'step-' + idx">{{ idx + 1 }}</div>
                            <span class="step-name">{{ step.key }}</span>
                            <span class="step-name-zh">{{ step.zh }}</span>
                            <span class="step-badge" :class="'step-' + idx + '-bg'">
                                {{ getStepFuncUnits(step.key).length }}
                            </span>
                        </div>
                        <div v-if="expandedSteps[step.key]" class="step-body">
                            <div v-for="(fu, fi) in getStepFuncUnits(step.key)" :key="fi" class="fu-item">
                                <span class="fu-name">{{ fu.name }}</span>
                                <span v-if="fu.entityNameCondition" class="fu-entity-cond">{{ fu.entityNameCondition }}</span>
                                <span v-if="fu.isRootNode !== null" class="fu-root-badge"
                                      :class="fu.isRootNode === 'TRUE' || fu.isRootNode === 'true' ? 'fu-root-true' : 'fu-root-false'">
                                    {{ fu.isRootNode === 'TRUE' || fu.isRootNode === 'true' ? '主表' : '子表' }}
                                </span>
                                <span v-if="fu.fullSpec !== fu.name" class="fu-spec">{{ fu.fullSpec }}</span>
                                <span class="fu-source" :class="getSourceClass(fu.source)">{{ fu.source }}</span>
                            </div>
                            <div v-if="getStepFuncUnits(step.key).length === 0"
                                 style="padding:16px 60px;color:#334155;font-size:13px">无 FuncUnit</div>
                        </div>
                    </div>

                    <!-- 数据库来源的 FuncUnit（未分配步骤或额外信息） -->
                    <div v-if="unassignedDbFuncUnits.length > 0" class="step-card" style="border-color:rgba(217,70,239,0.3)">
                        <div class="step-header" @click="expandedSteps['_db'] = !expandedSteps['_db']">
                            <div class="step-num" style="background:#d946ef">DB</div>
                            <span class="step-name">FuncUnit Customizer</span>
                            <span class="step-name-zh">数据库来源（未分配步骤或全方法生效）</span>
                            <span class="step-badge" style="background:rgba(217,70,239,0.15);color:#f0abfc">
                                {{ unassignedDbFuncUnits.length }}
                            </span>
                        </div>
                        <div v-if="expandedSteps['_db']" class="step-body">
                            <div v-for="(fu, fi) in unassignedDbFuncUnits" :key="fi" class="fu-item">
                                <span class="fu-name">{{ fu.name }}</span>
                                <span v-if="fu.stepType" class="fu-entity-cond">step: {{ fu.stepType || '未指定' }}</span>
                                <span v-if="fu.execMethod" style="font-size:10px;color:#64748b;margin-left:4px">method: {{ fu.execMethod }}</span>
                                <span class="fu-source from-db">{{ fu.source }}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </template>

            <template v-else>
                <div class="empty-state">
                    <h3>选择对象和操作方法</h3>
                    <p style="margin-top:8px">从左侧选择一个 Service 对象，再选择操作方法，查看完整的 FuncUnit 编排结果</p>
                    <p style="margin-top:16px;color:#334155;font-size:12px">
                        模拟器会解析 base → common → supplychain → app 各层 CSV 决策表，<br>
                        合并继承链，执行 include/exclude，展示最终的 FuncUnit 执行编排。
                    </p>
                </div>
            </template>
        </div>
    </div>
</div>

<script>
const STEPS = [
    { key: 'Preprocess', zh: '预处理' },
    { key: 'ValidateParameter', zh: '参数校验' },
    { key: 'DetermineFeasibility', zh: '可行性判断' },
    { key: 'HandleBusinessLogic', zh: '业务逻辑处理' },
    { key: 'DataPersistence', zh: '数据持久化' },
    { key: 'ExecutePostProcessing', zh: '后置处理' },
    { key: 'PerformActionOnExit', zh: '退出动作' },
];

const METHOD_TO_CSV = {
    'Add': 'AddHandlerMatchingRules.csv',
    'Update': 'UpdateHandlerMatchingRules.csv',
    'Remove': 'RemoveHandlerMatchingRules.csv',
    'DoAction': 'DoActionMatchingRules.csv',
    'NewData': 'NewDataHandlerMatchingRules.csv',
    'CheckValid': 'CheckValidHandlerMatchingRules.csv',
    'CheckReopen': 'CheckReopenHandlerMatchingRules.csv',
    'ProcessData': 'ProcessDataMatchingRules.csv',
    'UpdateBillStatus': 'UpdateBillStatusMatchingRules.csv',
    'EndApprovalProcess': 'EndApprovalProcessMatchingRules.csv',
    'UpdateEffective': 'UpdateEffectiveHandlerMatchingRules.csv',
    'BatchRemove': 'BatchRemoveHandlerMatchingRules.csv',
    'StartSubmitting': 'StartSubmittingMatchingRules.csv',
    'EndSubmitted': 'EndSubmittedMatchingRules.csv',
    'FullModeUpdate': 'FullModeUpdateHandlerMatchingRules.csv',
    'UpdateBillItemStatus': 'UpdateBillItemStatusMatchingRules.csv',
    'UpdateToolbarButton': 'UpdateToolbarButtonHandlerMatchingRules.csv',
};

// 反向：从操作名推导 CSV 文件名
function methodToCsvFile(method) {
    if (METHOD_TO_CSV[method]) return METHOD_TO_CSV[method];
    // 通用推导: method + HandlerMatchingRules.csv 或 MatchingRules.csv
    return method + 'HandlerMatchingRules.csv';
}

const { createApp, ref, reactive, computed, onMounted } = Vue;

const app = createApp({
    setup() {
        const folders = ref([]);
        const methods = ref([]);
        const selectedFolder = ref(null);
        const selectedMethod = ref(null);
        const simResult = ref(null);
        const fuFilter = ref('');
        const sourceFilter = ref(null);
        const expandedSteps = reactive({});

        STEPS.forEach(s => expandedSteps[s.key] = true);

        const displayMethod = computed(() => {
            if (!selectedMethod.value) return '';
            return selectedMethod.value;
        });

        function toggleStep(key) { expandedSteps[key] = !expandedSteps[key]; }

        function toggleSourceFilter(name) {
            sourceFilter.value = sourceFilter.value === name ? null : name;
        }

        function matchSource(fuSource, filterName) {
            if (!filterName) return true;
            if (filterName === 'DB') return fuSource && fuSource.startsWith('DB:');
            return fuSource === filterName;
        }

        function getStepFuncUnits(stepKey) {
            if (!simResult.value || !simResult.value.steps || !simResult.value.steps[stepKey]) return [];
            let list = simResult.value.steps[stepKey];
            if (sourceFilter.value) {
                list = list.filter(fu => matchSource(fu.source, sourceFilter.value));
            }
            if (fuFilter.value) {
                const kw = fuFilter.value.toLowerCase();
                list = list.filter(fu => fu.name.toLowerCase().includes(kw) || (fu.fullSpec && fu.fullSpec.toLowerCase().includes(kw)));
            }
            return list;
        }

        function getLayerClass(name) {
            if (name === 'base' || name === 'common') return 'base';
            if (name.includes('mixin') || name.includes('supplychain')) return 'mixin';
            return 'app';
        }

        function getSourceClass(source) {
            if (source && source.startsWith('DB:')) return 'from-db';
            if (source === 'base' || source === 'common') return 'from-base';
            if (source && (source.includes('mixin') || source.includes('supplychain'))) return 'from-mixin';
            return 'from-app';
        }

        const dbFuncUnitsCount = computed(() => {
            if (!simResult.value || !simResult.value.customizedFuncUnits) return 0;
            return simResult.value.customizedFuncUnits.length;
        });

        // 未分配到具体步骤的数据库 FuncUnit（stepType 为空或不在7步中的）
        const unassignedDbFuncUnits = computed(() => {
            if (!simResult.value || !simResult.value.customizedFuncUnits) return [];
            const stepKeys = STEPS.map(s => s.key);
            let list = simResult.value.customizedFuncUnits.filter(fu =>
                !fu.stepType || !stepKeys.includes(fu.stepType)
            );
            // 来源过滤：DB 标签选中时显示所有 DB，非 DB 标签选中时隐藏此区域
            if (sourceFilter.value && sourceFilter.value !== 'DB') return [];
            if (fuFilter.value) {
                const kw = fuFilter.value.toLowerCase();
                list = list.filter(fu => fu.name.toLowerCase().includes(kw));
            }
            return list;
        });

        async function loadFolders() {
            const r = await fetch('/api/decision-table/simulator/folders');
            folders.value = await r.json();
        }

        async function onFolderChange(folder) {
            selectedMethod.value = null;
            simResult.value = null;
            const r = await fetch(`/api/decision-table/simulator/folder/${folder}/methods`);
            methods.value = await r.json();
        }

        async function selectMethod(method) {
            selectedMethod.value = method;
            fuFilter.value = '';
            sourceFilter.value = null;

            // 推导 CSV 文件名
            const csvFile = methodToCsvFile(method);

            // 推导对象名（folder 首字母大写）
            const folder = selectedFolder.value;
            const objectName = folder.charAt(0).toUpperCase() + folder.slice(1);

            const r = await fetch(`/api/decision-table/simulator/simulate?objectName=${objectName}&csvFile=${csvFile}`);
            simResult.value = await r.json();
        }

        onMounted(loadFolders);

        return {
            STEPS, folders, methods, selectedFolder, selectedMethod,
            simResult, fuFilter, sourceFilter, expandedSteps, displayMethod,
            dbFuncUnitsCount, unassignedDbFuncUnits,
            toggleStep, toggleSourceFilter, getStepFuncUnits, getLayerClass, getSourceClass,
            onFolderChange, selectMethod,
        };
    }
});

app.use(ElementPlus);
for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
    app.component(key, component);
}
app.mount('#app');
</script>
</body>
</html>
